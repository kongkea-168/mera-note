<text class="khm" x="207" y="370" font-size="18" fill="#6b573a">•  ញ៉ាំកាហ្វេ</text>
<text class="lat" x="207" y="408" font-size="18" fill="#6b573a">•  Ship MERA Note v1.0</text>
