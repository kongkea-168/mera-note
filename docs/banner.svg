<text class="lat" x="700" y="214" font-size="20" font-weight="400" fill="#b3a9d9">A floating Khmer sticky note that lives on your desktop.</text>

<rect x="700" y="296" width="42" height="42" rx="12" fill="#7c4dff" fill-opacity="0.18" stroke="#b794ff" stroke-opacity="0.35" stroke-width="1"/>
