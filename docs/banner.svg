<text class="khm" x="207" y="252" font-size="22" font-weight="700" fill="#4a3b22">ការងារថ្ងៃនេះ</text>
<text class="khm" x="207" y="294" font-size="18" fill="#6b573a">•  ផ្ញើអ៊ីមែលទៅក្រុម</text>
