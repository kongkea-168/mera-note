<svg width="1280" height="640" viewBox="0 0 1280 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MERA Note marketing banner</title>
<desc>A floating Khmer sticky-note app mockup beside the app name and its top features: always on top, ten themes, Khmer and English support, and fully local and private.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Khmer:wght@400;600;700&amp;display=swap');
.lat{font-family:'Inter','Helvetica Neue',Arial,sans-serif}
.khm{font-family:'Noto Sans Khmer','Khmer MN','Khmer Sangam MN',sans-serif}
</style>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7c4dff" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#c14dff" stop-opacity="0.40"/>
<stop offset="100%" stop-color="#c14dff" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1280" height="640" fill="#15102b"/>
