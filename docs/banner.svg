<circle cx="714" cy="381" r="4" fill="#ff8ab0"/><circle cx="722" cy="381" r="4" fill="#8ad1ff"/><circle cx="730" cy="381" r="4" fill="#b6ff8a"/>
<text class="lat" x="762" y="387" font-size="21" font-weight="500" fill="#ece8f9">10 themes, from pastel to cyberpunk</text>

<rect x="700" y="424" width="42" height="42" rx="12" fill="#7c4dff" fill-opacity="0.18" stroke="#b794ff" stroke-opacity="0.35" stroke-width="1"/>
<text class="khm" x="721" y="453" text-anchor="middle" font-size="23" font-weight="700" fill="#c9b3ff">ក</text>
<text class="lat" x="762" y="451" font-size="21" font-weight="500" fill="#ece8f9">Khmer and English, beautiful type</text>

<rect x="700" y="488" width="42" height="42" rx="12" fill="#7c4dff" fill-opacity="0.18" stroke="#b794ff" stroke-opacity="0.35" stroke-width="1"/>
<path d="M713 506 v-4 a8 8 0 0 1 16 0 v4" fill="none" stroke="#c9b3ff" stroke-width="2.4"/>
<rect x="709" y="506" width="24" height="18" rx="3" fill="#c9b3ff"/>
<circle cx="721" cy="514" r="2.4" fill="#15102b"/>
<text class="lat" x="762" y="515" font-size="21" font-weight="500" fill="#ece8f9">100% local and private — no cloud</text>

<text class="lat" x="700" y="600" font-size="16" font-weight="400" fill="#9a90c4">Free and open source  ·  macOS + Windows  ·  Apache-2.0 licensed</text>
